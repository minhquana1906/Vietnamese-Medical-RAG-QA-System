services:
  chatbot_ui:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: chatbot_ui
    restart: always
    ports:
      - "8501:8501"
    expose:
      - 8501
    volumes:
      - .:/app/frontend
    networks:
      - medical_rag_network

networks:
  medical_rag_network:
    external: true
