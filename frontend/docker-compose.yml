services:
  chatbot_ui:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: chatbot_ui
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8501
    networks:
      - medical_rag_qa_network

networks:
  medical_rag_qa_network:
    external: true
