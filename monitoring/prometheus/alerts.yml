groups:
  - name: rag_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: rate(rag_requests_total{status="error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 0.05)"

      # High latency alert
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(rag_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency detected"
          description: "P95 latency is {{ $value }}s (threshold: 5s)"

      # Cache hit rate too low
      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Cache hit rate below threshold"
          description: "Cache hit rate is {{ $value }} (threshold: 0.3)"

      # Model serving down
      - alert: ModelServingDown
        expr: up{job=~"vllm"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model serving instance down"
          description: "{{ $labels.job }} is down"
