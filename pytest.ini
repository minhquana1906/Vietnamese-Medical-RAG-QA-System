# Integration Tests Configuration
# Pytest configuration for integration tests

[pytest]
# Test paths
testpaths = tests/integration

# Python files
python_files = test_*.py

# Python classes
python_classes = Test*

# Python functions
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    audio: marks tests that require audio files
    documents: marks tests for document CRUD
    indexing: marks tests for indexing pipeline
    models: marks tests for model API endpoints
    rag: marks tests for RAG endpoint

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=backend/src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = backend/src
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */migrations/*
    */alembic/*
branch = True
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
