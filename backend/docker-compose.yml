services:
  qdrant_db:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - medical_rag_network

  redis_db:
    image: redis:7.2-bookworm
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redisadmin}
    command:
      [
        "sh",
        "-c",
        "redis-server --requirepass $${REDIS_PASSWORD} --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    networks:
      - medical_rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisadmin}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=medical-rag-cluster
      - node.name=elasticsearch-node
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - medical_rag_network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  chatbot_api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: chatbot_api
    restart: always
    ports:
      - "8000:8000"
    command: /bin/bash -c "python scripts/init_nltk.py && uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info"
    env_file:
      - .env
    depends_on:
      qdrant_db:
        condition: service_started
      redis_db:
        condition: service_healthy
    volumes:
      - nltk_data:/app/nltk_data
      - .:/app/backend
    networks:
      - medical_rag_network

  chatbot_worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: chatbot_worker
    restart: always
    env_file:
      - .env
    depends_on:
      redis_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      chatbot_api:
        condition: service_started
    user: root
    command: /bin/bash -c "mkdir -p /app/logs/worker && chown -R 1000:1000 /app/logs/worker && su app -c 'celery -A src.tasks.celery_app worker --loglevel=debug --logfile /app/logs/worker/worker.log'"
    volumes:
      - .:/app/backend
      - worker_volume:/app/logs/worker
      - nltk_data:/app/nltk_data
    networks:
      - medical_rag_network

networks:
  medical_rag_network:
    external: true

volumes:
  qdrant_data:
  redis_data:
  elasticsearch_data:
  worker_volume:
  nltk_data:
