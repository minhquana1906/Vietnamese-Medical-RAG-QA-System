# LoRA Configuration for Qwen3-Embedding-0.6B Fine-tuning
#
# This configuration defines hyperparameters for LoRA fine-tuning
# of the embedding model on Vietnamese medical dataset using contrastive learning.
#
# References:
# - LoRA paper: https://arxiv.org/abs/2106.09685
# - Sentence Transformers: https://www.sbert.net/
# - Contrastive Learning: https://arxiv.org/abs/2004.11362

model:
  base_model: "Qwen/Qwen3-Embedding-0.6B"
  model_type: "embedding"
  trust_remote_code: true

# LoRA hyperparameters
lora:
  # Rank of the low-rank matrices (r)
  # For embedding models, can use higher rank than generation models
  # Typical values: 16, 32, 64
  r: 32
  
  # Alpha parameter for LoRA scaling (lora_alpha)
  # Scaling factor: alpha / r
  # Typical values: 32, 64
  lora_alpha: 64
  
  # Dropout probability for LoRA layers
  lora_dropout: 0.1
  
  # Target modules to apply LoRA
  # For Qwen3-Embedding: apply to all attention and FFN layers
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  
  # Bias handling
  bias: "none"
  
  # Task type
  task_type: "FEATURE_EXTRACTION"

# Quantization (optional for embedding model)
quantization:
  # Embedding models are smaller, quantization may not be necessary
  # Enable only if VRAM is limited
  use_qlora: false
  
  quant_type: "nf4"
  compute_dtype: "float16"
  use_double_quant: false

# Training hyperparameters
training:
  # Number of training epochs
  num_epochs: 5
  
  # Batch size per device
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  
  # Gradient accumulation steps
  gradient_accumulation_steps: 2
  
  # Learning rate
  # Embedding models often use lower learning rates
  learning_rate: 1.0e-4
  
  # Warmup steps
  warmup_steps: 500
  
  # Weight decay for regularization
  weight_decay: 0.01
  
  # Maximum gradient norm for clipping
  max_grad_norm: 1.0
  
  # Optimizer
  optimizer: "adamw_torch"
  
  # Learning rate scheduler
  lr_scheduler_type: "cosine"

# Contrastive learning configuration
contrastive:
  # Loss function
  # Options: "cosine_similarity", "multiple_negatives_ranking", "triplet"
  loss_function: "multiple_negatives_ranking"
  
  # Temperature for contrastive loss
  # Lower temperature = harder negatives
  temperature: 0.05
  
  # Number of hard negatives per positive
  num_hard_negatives: 3
  
  # Mining strategy for hard negatives
  # Options: "random", "hard", "semi_hard"
  mining_strategy: "semi_hard"
  
  # Similarity metric
  # Options: "cosine", "dot_product"
  similarity_metric: "cosine"

# Data configuration
data:
  # Maximum sequence length (Qwen3-Embedding supports 32K context, 8192 recommended for training)
  max_length: 8192
  
  # Padding side (IMPORTANT: Qwen3-Embedding requires LEFT padding)
  padding_side: "left"
  
  # Truncation
  truncation: true
  
  # Pooling strategy for embeddings
  # IMPORTANT: Qwen3-Embedding uses last_token_pool (not mean/cls pooling)
  pooling_strategy: "last_token"
  
  # Normalize embeddings (L2 normalization)
  normalize_embeddings: true
  
  # Instruction format for queries (documents don't need instruction)
  use_instruction: true
  instruction_template: "Instruct: {task}\nQuery: {query}"

# Data augmentation
augmentation:
  # Enable data augmentation
  enabled: true
  
  # Augmentation techniques
  techniques:
    - "back_translation"  # Translate to English and back to Vietnamese
    - "synonym_replacement"  # Replace words with synonyms
    - "random_deletion"  # Randomly delete words
  
  # Augmentation probability
  augmentation_prob: 0.3

# Logging and checkpointing
logging:
  # Steps between logging
  logging_steps: 10
  
  # Steps between evaluation
  eval_steps: 1000
  
  # Steps between saving checkpoints
  save_steps: 1000
  
  # Maximum number of checkpoints to keep
  save_total_limit: 3
  
  # Report to W&B
  report_to: "wandb"

# Evaluation
evaluation:
  # Evaluation strategy: "steps", "epoch", "no"
  eval_strategy: "steps"
  
  # Load best model at end
  load_best_model_at_end: true
  
  # Metric for best model
  # Options: "eval_loss", "retrieval_mrr", "retrieval_ndcg"
  metric_for_best_model: "retrieval_mrr"
  
  # Whether higher metric is better
  greater_is_better: true
  
  # Retrieval evaluation settings
  retrieval_k_values: [1, 5, 10, 20]

# Mixed precision training
mixed_precision:
  # Enable FP16 training
  fp16: true
  
  # Enable BF16 training (if supported by hardware)
  bf16: false

# Special considerations for medical domain
domain_adaptation:
  # Use domain-specific vocabulary
  use_medical_vocab: true
  
  # Medical entity masking probability
  # Mask medical entities during training to improve robustness
  entity_masking_prob: 0.15
  
  # Entity types to mask
  entity_types:
    - "DISEASE"
    - "DRUG"
    - "SYMPTOM"
    - "TREATMENT"
    - "ANATOMY"

# Notes:
# 1. Embedding model (0.6B) is much smaller than generation model (4B)
# 2. Can use larger batch sizes without quantization
# 3. Contrastive learning requires careful negative sampling
# 4. For 24GB VRAM: Use batch_size=16, no quantization needed
# 5. If using multiple GPUs: Increase batch_size proportionally
# 6. Medical domain fine-tuning benefits from:
#    - More epochs (5-10)
#    - Domain-specific data augmentation
#    - Entity-aware training
