services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton_server
    restart: always
    ports:
      - "8002:8000"   # HTTP
      - "8003:8001"   # gRPC
      - "8004:8002"   # Metrics
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./models:/models
      - triton_cache:/root/.cache/huggingface
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=qwen3_embedding
      - --load-model=qwen3_reranker
      - --load-model=qwen3_guard
      - --strict-model-config=false
      - --log-verbose=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - medical_rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  medical_rag_network:
    external: true

volumes:
  triton_cache:
