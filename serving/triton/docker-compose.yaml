services:
  # Embedding + Reranking + Guardrails (standalone - generation served via remote vLLM)
  triton:
    build:
      context: .
      dockerfile: Dockerfile
    image: triton-server-custom:latest
    container_name: triton_server
    restart: unless-stopped
    ports:
      - "8002:8000" # HTTP
      - "8003:8001" # gRPC
      - "8004:8002" # Metrics
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ./models:/models
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - triton_cache:/root/.cache/huggingface
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - medical_rag_network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  medical_rag_network:
    external: true

volumes:
  triton_cache:
