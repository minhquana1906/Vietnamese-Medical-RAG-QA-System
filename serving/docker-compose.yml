services:
  # Generation model (uses ~60% GPU memory)
  vllm:
    image: vllm/vllm-openai:v0.11.0
    container_name: vllm_server
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-4B-Instruct-2507}
      - GPU_MEMORY_UTIL=0.6 # Use only 60% GPU memory
      - MAX_MODEL_LEN=8192 # Reduce context length to save memory
      - TENSOR_PARALLEL_SIZE=1
    volumes:
      - vllm_cache:/root/.cache/huggingface
      - ./vllm/entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - medical_rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Embedding + Reranking + Guardrails (shares remaining ~40% GPU memory)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton_server
    restart: unless-stopped
    ports:
      - "8002:8000" # HTTP
      - "8003:8001" # gRPC
      - "8004:8002" # Metrics
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps # Enable MPS for GPU sharing
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
    volumes:
      - ./triton/models:/models
      - triton_cache:/root/.cache/huggingface
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=qwen3_embedding
      - --load-model=qwen3_reranker
      - --load-model=qwen3_guard
      - --strict-model-config=false
      - --log-verbose=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - medical_rag_network
    depends_on:
      - vllm
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  medical_rag_network:
    driver: bridge

volumes:
  vllm_cache:
  triton_cache:
