services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    container_name: vllm_server
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8001}:8000"
    environment:
      # GPU configuration
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      # HuggingFace token for private models
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      # vLLM configuration via env vars
      - VLLM_HOST=${VLLM_HOST:-0.0.0.0}
      - VLLM_PORT=${VLLM_INTERNAL_PORT:-8000}
      - GPU_MEMORY_UTIL=${GPU_MEMORY_UTIL:-0.7}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-1}
      # Model path (can be local or HuggingFace repo)
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
    volumes:
      # Local model cache (optional if using HF repo directly)
      - ${MODEL_PATH:-./models}:/models:ro
      # HuggingFace cache to avoid re-downloading
      - vllm_cache:/root/.cache/huggingface
      # Mount entrypoint script
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
        limits:
          memory: ${MEMORY_LIMIT:-16G}
    networks:
      - medical_rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  medical_rag_network:
    external: true

volumes:
  vllm_cache:
